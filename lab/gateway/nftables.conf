#!/usr/sbin/nft -f
# Base firewall for the gateway. Default-forward is ACCEPT so the lab works out of the
# box; Blue tightens this at runtime by inserting drop rules (block_ip / rate_limit tools).
#
# Segmentation intent (documented for the report):
#   - attacker_net may reach the dmz webapp only (not the db directly).
#   - internal_net (db) is reachable only from the dmz.
#   - nothing reaches the internet (enforced by Docker internal:true networks).

flush ruleset

table ip filter {
    chain input {
        type filter hook input priority 0; policy accept;
        # the WAF proxy (:8080) only takes traffic the nat table redirected to it;
        # direct connections to the gateway's port 8080 are dropped
        tcp dport 8080 ct mark != 0x1 drop
    }

    chain forward {
        type filter hook forward priority 0; policy accept;

        # established/related first so return traffic is never blocked by Blue's rules
        ct state established,related accept

        # --- Segmentation policy ---
        # attacker_net -> db (internal_net) is forbidden: Red must pivot through the webapp
        ip saddr 10.10.1.0/24 ip daddr 10.10.3.0/24 drop

        # Blue inserts per-IP drops ABOVE this comment at runtime, e.g.:
        #   nft insert rule ip filter forward ip saddr 10.10.1.50 drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# NAT: masquerade cross-segment traffic the gateway forwards, so target containers need
# no per-container default route (they just reply to the gateway on their own subnet).
# This runs at POSTROUTING, AFTER Suricata sees the real source IP on ingress (eth0) and
# AFTER Blue's drop rules in the FORWARD chain match the real IP — so detection and
# block_ip still work on the true attacker address, while any target image drops in cleanly.
table ip nat {
    # Empty by default. When Blue adds its first block_pattern, the orchestrator inserts
    #   ip saddr 10.10.1.0/24 ip daddr 10.10.2.11 tcp dport 3000 redirect to :8080
    # so client traffic to Juice Shop goes through the WAF proxy (waf.py).
    chain prerouting {
        type nat hook prerouting priority -100; policy accept;
    }
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        ip saddr 10.10.1.0/24 ip daddr 10.10.2.0/24 masquerade
        ip saddr 10.10.2.0/24 ip daddr 10.10.3.0/24 masquerade
    }
}
